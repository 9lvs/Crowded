version: 2
# Updates target main and arrive as one grouped PR per ecosystem each week, to keep noise low.
# Major version bumps of GitHub Actions are ignored here and reviewed by hand (pinned SHAs).
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "main"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "main"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
  - package-ecosystem: "npm"
    directory: "/e2e"
    target-branch: "main"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    groups:
      e2e:
        patterns: ["*"]
