name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "docs/openapi.json"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/openapi.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (simulator)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: API contract copy is current
        working-directory: .
        run: python3 ios/scripts/sync_openapi.py --check

      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, devs in data.items() if "iOS" in runtime for d in devs]
          preferred = [n for n in ["iPhone 16", "iPhone 16 Pro", "iPhone 15"] if n in names]
          phones = [n for n in names if n.startswith("iPhone")]
          print((preferred or phones)[0])
          ')
          echo "Simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project Crowded.xcodeproj -scheme Crowded \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Crowded.xcodeproj \
            -scheme Crowded \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
          retention-days: 7
